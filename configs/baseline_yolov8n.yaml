# Reference baseline — YOLOv8n (COCO-pretrained), 640 px
# Role: reference baseline for Experiment 1
# Factor under study: detector family (v8n vs v11n) — this side is v8n
# Do NOT use test split for selection.

experiment_role: reference_baseline
variant: none
model: yolov8n.pt
imgsz: 640
batch: 16
epochs: 100
patience: 30
seed: 0                          # override per manifest row (0/1/2)
data: configs/rdd2022.yaml
pretrained: true
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
conf: 0.001
iou: 0.7
max_det: 300
amp: true
workers: 8
project: results/experiments
name: baseline_yolov8n
class_mapping:
  D00: 0
  D10: 1
  D20: 2
  D40: 3
primary_metric: metrics/mAP50(B)
checkpoint_selection: best_val_mAP50
notes: >
  Standard Ultralytics YOLOv8n detect recipe. Reference baseline only.
  Compare against baseline_yolo11n.yaml under identical data/epochs/eval.
