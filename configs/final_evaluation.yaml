protocol_id: week6_final_v1
protocol_frozen: true
freeze_date_utc: '2026-11-06'
test_evaluation_completed: true
final_model:
  experiment: yolo11n_640
  display_name: YOLO11n @ 640 (Week 5 selected / control)
  architecture: stock YOLO11n Detect(P3, P4, P5)
  checkpoint: results/week5/yolo11n_640/seed_0/train/weights/best.pt
  selection_source: results/week5/model_selection_decision.md
  selection_metric: mean_val_mAP50
  test_used_for_selection: false
  input_resolution: 640
  train_batch_size_nominal: 16
  seed: 0
