# Shared training recipe — held constant across Week 2/3 experiments
# unless the experiment explicitly studies one of these factors.
#
# Checkpoint selection: best validation mAP@0.5 (Ultralytics default fitness
# dominated by mAP). Never use the test split for model selection.

project_seed_data: 6845          # data prep / debugging only
comparison_seeds: [0, 1, 2]      # main multi-seed comparisons

# Dataset (Week 1 fixed splits — do not regenerate for experiments)
data: configs/rdd2022.yaml
class_mapping:
  D00: 0
  D10: 1
  D20: 2
  D40: 3
nc: 4
names: [D00, D10, D20, D40]

# Optimization (Ultralytics standard detect recipe)
optimizer: auto                  # Ultralytics auto (SGD/AdamW by schedule)
epochs: 100
patience: 30                     # early stopping on val fitness
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false

# Batch policy: choose largest power-of-two that fits GPU memory for the
# image size under study; record the actual batch used in the run log.
# Reference defaults (override per hardware in the run command if needed):
batch_policy: fit_gpu_memory
batch_640: 16
batch_800: 8

# Augmentation (held constant; not an experimental factor this week)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Inference / NMS (held constant for all comparisons)
conf: 0.001                      # low conf for mAP computation
iou: 0.7                         # NMS IoU
max_det: 300

# Checkpoint rule
save: true
save_period: -1
exist_ok: false
pretrained: true                 # COCO-pretrained weights when available
amp: true                        # mixed precision when CUDA is available

# Primary selection metric (validation only)
primary_metric: metrics/mAP50(B)
checkpoint_selection: best_val_mAP50
