# Team investigation — YOLO11n + P2 head + lightweight attention, 640 px
# Role: Experiment 5 (combined modification)
# Intended major factors: P2 + attention together (interaction / upper bound)
# Held constant vs strong baseline: data, epochs, optimizer, imgsz=640,
#   batch policy, augmentation, conf/NMS, checkpoint rule
# Do NOT use test split for selection.
#
# Note: This intentionally changes TWO architecture factors relative to the
# strong baseline. It is NOT a single-factor ablation; treat as a combined
# model after Exps 2–3. The config checker flags multi_factor=true.

experiment_role: team_investigation
variant: p2_attention
multi_factor: true
model: configs/models/yolo11n_p2_attention.yaml
pretrained_weights: yolo11n.pt
imgsz: 640
batch: 16
epochs: 100
patience: 30
seed: 0
data: configs/rdd2022.yaml
pretrained: true
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
conf: 0.001
iou: 0.7
max_det: 300
amp: true
workers: 8
project: results/experiments
name: variant_p2_attention
class_mapping:
  D00: 0
  D10: 1
  D20: 2
  D40: 3
primary_metric: metrics/mAP50(B)
checkpoint_selection: best_val_mAP50
architecture:
  description: >
    Combine the P2 stride-4 head with the lightweight neck-attention block.
    Used only after single-factor Exps 2 and 3 are defined.
  detection_strides: [4, 8, 16, 32]
  attention_location: neck
notes: >
  Combined model (Exp 5). Declared multi_factor so the checker does not
  treat it as a single-factor violation.
