# Week 5 Exp 1 — YOLO11n baseline @ 640 (control)
experiment_name: yolo11n_640
experiment_role: week5_ablation
variant: baseline
model: yolo11n.pt
pretrained: true
imgsz: 640
batch: 16
epochs: 100
patience: 30
seed: 0
data: configs/rdd2022.yaml
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
conf: 0.001
iou: 0.7
max_det: 300
amp: true
workers: 8
project: results/week5/yolo11n_640
name: train
class_mapping:
  D00: 0
  D10: 1
  D20: 2
  D40: 3
primary_metric: metrics/mAP50(B)
checkpoint_selection: best_val_mAP50
test_used_for_selection: false
notes: >
  Control for Week 5. Identical recipe to strong baseline except results path.
  Factors under study in other configs are held fixed here.
